name: mi_cuaderno
description: "MiCuaderno - Gestión de paquetes y envíos"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Calendar widget
  table_calendar: ^3.1.3

  # Date formatting
  intl: ^0.20.2

  # UUID for package IDs
  uuid: ^4.5.1

  # Animations
  flutter_animate: ^4.5.0

  # Copia del cuaderno y fotos
  share_plus: ^11.0.0
  file_picker: ^10.2.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
